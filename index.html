<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거래명세서 생성기 | 리와인드랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a2f5a;--navy2:#243870;--accent:#c8a96e;--bg:#f4f4f0;--white:#fff;--border:#d8d8d4;--text:#1e1e1e;--muted:#888;--surface:#f9f9f7;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--navy);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0;}
header h1{color:#fff;font-size:16px;font-weight:600;}
.hlink{color:rgba(255,255,255,0.75);font-size:12px;text-decoration:none;padding:5px 11px;border:1px solid rgba(255,255,255,0.3);border-radius:5px;}
.hlink:hover{background:rgba(255,255,255,0.12);color:#fff;}
.wrap{display:grid;grid-template-columns:420px 1fr;flex:1;overflow:hidden;}
.form-panel{background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.form-body{flex:1;overflow-y:auto;padding:14px;}
.form-footer{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--white);flex-shrink:0;}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:11px 13px;margin-bottom:8px;}
.sec-t{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--navy);margin-bottom:8px;}
.f{margin-bottom:6px;}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:500;}
.f input,.f select{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text);background:#fff;}
.f input:focus,.f select:focus{outline:none;border-color:var(--navy);}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}

.pl-sort-btn{padding:4px 10px;border:1px solid #c8d0e8;border-radius:4px;background:#fff;color:#888;font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;transition:all .15s;}
.pl-sort-btn:hover{border-color:var(--navy);color:var(--navy);}
.pl-sort-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600;}
/* PRICE LIST BAR */
.pl-bar{background:#eef1fa;border:1px solid #c8d0e8;border-radius:7px;padding:10px 12px;margin-bottom:8px;}
.pl-t{font-size:11px;font-weight:600;color:var(--navy);margin-bottom:6px;}
.pl-bar select{width:100%;padding:6px 9px;border:1px solid #c8d0e8;border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;margin-bottom:6px;}
.pl-bar select:focus{outline:none;border-color:var(--navy);}
.pl-btns{display:flex;gap:6px;}
.btn-pl{padding:6px 12px;background:var(--navy);color:#fff;border:none;border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;cursor:pointer;}
.btn-pl:hover{background:var(--navy2);}
.btn-pl-o{padding:5px 9px;background:#fff;color:var(--navy);border:1px solid var(--navy);border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;cursor:pointer;}
.btn-pl-o:hover{background:var(--navy);color:#fff;}

/* ITEMS */
.ih{display:grid;grid-template-columns:16px 1fr 52px 52px 72px 72px 18px;gap:3px;padding:0 0 5px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.ih span{font-size:10px;font-weight:600;color:var(--muted);}
.ir{display:grid;grid-template-columns:16px 1fr 52px 52px 72px 72px 18px;gap:3px;align-items:center;margin-bottom:3px;}
.ir .rn{font-size:10px;color:var(--muted);text-align:center;}
.ir input{padding:5px 6px;border:1px solid var(--border);border-radius:3px;font-family:'Noto Sans KR',sans-serif;font-size:12px;width:100%;}
.ir input:focus{outline:none;border-color:var(--navy);}
.ir .au{padding:5px 6px;font-size:12px;color:#666;text-align:right;background:#f5f5f2;border:1px solid #e8e8e4;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:13px;padding:0;line-height:1;}
.btn-del:hover{color:#e53;}
.btn-add-row{width:100%;margin-top:4px;padding:7px;background:none;border:1px dashed var(--border);border-radius:4px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;}
.btn-add-row:hover{border-color:var(--navy);color:var(--navy);background:#f0f2f8;}

/* TOTALS */
.totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:8px 10px;}
.tc.hi{background:#eef1f9;border-color:#c5ccdf;}
.tc .lbl{font-size:10px;color:var(--muted);margin-bottom:2px;}
.tc .val{font-size:14px;font-weight:600;}
.tc.hi .val{color:var(--navy);font-size:16px;}

/* ACTION BUTTONS */
.btn-primary{flex:2;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:var(--navy2);}
.btn-secondary{flex:1;padding:10px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:6px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.btn-secondary:hover{background:var(--navy);color:#fff;}

/* PREVIEW */
.preview-panel{background:#e8e8e3;padding:24px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.preview-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:12px;}
.document{background:#fff;width:690px;padding:32px;box-shadow:0 2px 22px rgba(0,0,0,.12);}
.doc-title{text-align:center;font-size:22px;font-weight:600;letter-spacing:6px;color:var(--navy);margin-bottom:18px;padding-bottom:13px;border-bottom:2px solid var(--navy);}
.doc-meta{text-align:right;font-size:11px;color:var(--muted);margin-bottom:8px;margin-top:-11px;}
.doc-parties{display:grid;grid-template-columns:1fr 1fr;border:1px solid #444;margin-bottom:8px;}
.party{padding:9px 12px;}
.party:first-child{border-right:1px solid #444;}
.party-hd{font-size:10px;font-weight:700;color:var(--navy);letter-spacing:.8px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #eee;}
.party-row{display:flex;gap:6px;margin-bottom:3px;font-size:11px;}
.party-lbl{min-width:64px;color:var(--muted);flex-shrink:0;}
.party-val{font-weight:500;word-break:keep-all;}
.doc-sums{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border:1px solid #444;border-top:none;margin-bottom:8px;}
.sc{padding:7px 11px;border-right:1px solid #444;}
.sc:last-child{border-right:none;background:#f0f3fa;}
.sl{font-size:10px;color:var(--muted);margin-bottom:2px;}
.sv{font-size:13px;font-weight:700;color:var(--navy);}
.sc:last-child .sv{font-size:15px;}
.doc-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.doc-table th{background:var(--navy);color:#fff;padding:7px 6px;text-align:center;font-weight:500;border:1px solid var(--navy);white-space:nowrap;}
.doc-table th.l{text-align:left;padding-left:8px;}
.doc-table th.r{text-align:right;padding-right:6px;}
.doc-table td{padding:7px 6px;border:1px solid #ccc;text-align:right;}
.doc-table td.c{text-align:center;}
.doc-table td.l{text-align:left;padding-left:8px;word-break:keep-all;}
.doc-table tr:nth-child(even) td{background:#fafaf8;}
.doc-table .trt td{background:#eef1f9!important;font-weight:700;color:var(--navy);border-top:2px solid var(--navy);}
.doc-note{margin-top:8px;padding:7px 10px;background:#fafaf8;border:1px solid #e4e4e0;border-radius:3px;font-size:11px;color:var(--muted);}
.doc-sign{margin-top:14px;text-align:right;font-size:10px;color:#aaa;}

@media(max-width:900px){.wrap{grid-template-columns:1fr;}.preview-panel{display:none;}}
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div id="pwScreen" style="position:fixed;inset:0;background:#1a2f5a;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;border-radius:14px;padding:40px 44px;width:340px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.3);">
    <div style="font-size:36px;margin-bottom:12px;">🔐</div>
    <div style="font-size:18px;font-weight:600;color:#1a2f5a;margin-bottom:4px;">리와인드랩</div>
    <div style="font-size:12px;color:#888;margin-bottom:24px;">거래명세서 생성기</div>
    <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요"
      style="width:100%;padding:11px 14px;border:1.5px solid #d8d8d4;border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:14px;margin-bottom:8px;outline:none;"
      onkeydown="if(event.key==='Enter')tryLogin()"
      onfocus="this.style.borderColor='#1a2f5a'" onblur="this.style.borderColor='#d8d8d4'">
    <div id="pwErr" style="display:none;color:#c0392b;font-size:12px;margin-bottom:8px;">비밀번호가 올바르지 않습니다.</div>
    <button onclick="tryLogin()"
      style="width:100%;padding:11px;background:#1a2f5a;color:#fff;border:none;border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer;">
      로그인
    </button>
    <div style="margin-top:16px;font-size:11px;color:#bbb;">주식회사 리와인드랩 내부용</div>
  </div>
</div>

<header>
  <h1>📄 거래명세서 생성기</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="color:var(--accent);font-size:11px;">주식회사 리와인드랩</span>
    <a href="transactions.html" class="hlink">📊 거래내역</a>
    <a href="pricelist.html" class="hlink">📋 가격표 관리</a>
  </div>
</header>

<div class="wrap">
  <!-- 왼쪽 폼 -->
  <div class="form-panel">
    <div class="form-body">

      <!-- 기본 정보 -->
      <div class="sec">
        <div class="sec-t">기본 정보</div>
        <div class="r3">
          <div class="f"><label>작성일</label><input type="date" id="issueDate" oninput="upd()"></div>
          <div class="f"><label>문서번호</label><input type="text" id="docNo" placeholder="RL-2026-001" oninput="upd()"></div>
          <div class="f"><label>세금 유형</label>
            <select id="taxType" onchange="upd()">
              <option value="taxable">과세 (10%)</option>
              <option value="exempt">면세</option>
              <option value="zero">영세율</option>
              <option value="inclusive">부가세 포함가</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 가격표 연동 -->
      <div class="pl-bar">
        <div class="pl-t">📋 가격표 불러오기 <span id="plSt" style="font-size:11px;color:#888;font-weight:400;">· 로딩 중...</span></div>
        <div id="plBody"><div style="font-size:12px;color:#aaa;">GitHub에서 가격표를 불러오는 중...</div></div>
      </div>

      <!-- 공급받는자 -->
      <div class="sec">
        <div class="sec-t">공급받는자 (거래처)</div>
        <div class="f"><label>상호</label><input type="text" id="rcvName" placeholder="거래처 상호명" oninput="upd()"></div>
        <div class="r2">
          <div class="f"><label>대표자</label><input type="text" id="rcvCeo" placeholder="대표자명" oninput="upd()"></div>
          <div class="f"><label>사업자등록번호</label><input type="text" id="rcvBizNo" placeholder="000-00-00000" oninput="upd()"></div>
        </div>
        <div class="f"><label>주소</label><input type="text" id="rcvAddr" placeholder="주소" oninput="upd()"></div>
        <div class="r2">
          <div class="f"><label>업태</label><input type="text" id="rcvType" placeholder="업태" oninput="upd()"></div>
          <div class="f"><label>종목</label><input type="text" id="rcvItem" placeholder="종목" oninput="upd()"></div>
        </div>
        <div class="f"><label>담당자</label><input type="text" id="rcvContact" placeholder="담당자명" oninput="upd()"></div>
      </div>

      <!-- 공급자 -->
      <div class="sec">
        <div class="sec-t">공급자 (발행사)</div>
        <div class="f"><label>상호</label><input type="text" id="supName" value="주식회사 리와인드랩" oninput="upd()"></div>
        <div class="r2">
          <div class="f"><label>대표자</label><input type="text" id="supCeo" value="황윤재" oninput="upd()"></div>
          <div class="f"><label>사업자등록번호</label><input type="text" id="supBizNo" value="744-87-02531" oninput="upd()"></div>
        </div>
        <div class="f"><label>주소</label><input type="text" id="supAddr" value="대구광역시 달성군 유가읍 헌풍로47길 86-2, 102호" oninput="upd()"></div>
        <div class="r2">
          <div class="f"><label>업태</label><input type="text" id="supType" value="제조, 도소매" oninput="upd()"></div>
          <div class="f"><label>종목</label><input type="text" id="supItem" value="화장품, 미용기기" oninput="upd()"></div>
        </div>
        <div class="f"><label>담당자</label><input type="text" id="supContact" placeholder="담당자명" oninput="upd()"></div>
      </div>

      <!-- 품목 -->
      <div class="sec">
        <div class="sec-t">품목</div>
        <div class="ih">
          <span></span><span>품명</span>
          <span style="text-align:center">규격/단위</span>
          <span style="text-align:right">수량</span>
          <span style="text-align:right" id="hdrPrice">단가</span>
          <span style="text-align:right" id="hdrAuto">공급가액</span>
          <span></span>
        </div>
        <div id="itemsBody"></div>
        <button class="btn-add-row" onclick="addRow()">+ 품목 추가</button>
      </div>

      <!-- 합계 -->
      <div class="totals">
        <div class="tc"><div class="lbl">공급가액</div><div class="val" id="tSup">₩0</div></div>
        <div class="tc"><div class="lbl" id="taxLbl">세액 (10%)</div><div class="val" id="tTax">₩0</div></div>
        <div class="tc hi"><div class="lbl">합계금액</div><div class="val" id="tGrand">₩0</div></div>
      </div>

      <!-- 비고 -->
      <div class="sec">
        <div class="sec-t">비고</div>
        <div class="f"><input type="text" id="note" placeholder="결제조건, 특이사항 등" oninput="upd()"></div>
      </div>

    </div><!-- /form-body -->

    <div class="form-footer">
      <button class="btn-primary" id="btnExcel" onclick="dlExcel()">⬇ Excel 다운로드</button>
      <button class="btn-primary" style="background:#1d7a4f;flex:2;" onclick="saveAndPrint()">💾 저장 후 발행</button>
      <button class="btn-secondary" id="btnPrint" onclick="doPrint()">🖨 인쇄 / PDF</button>
    </div>
  </div><!-- /form-panel -->

  <!-- 미리보기 -->
  <div class="preview-panel">
    <div class="preview-label">실시간 미리보기</div>
    <div class="document" id="docEl"></div>
  </div>
</div>

<script>
/* ════════════════════════════
   전역 변수
════════════════════════════ */
var rows = [];
var cnt = 0;
var plData = null;
var PW = 'rl2026'; // ← 비밀번호 변경 시 이 부분만 수정

/* ════════════════════════════
   유틸
════════════════════════════ */
function $(id) { return document.getElementById(id); }
function fmt(n) { return (Math.round(n) || 0).toLocaleString('ko-KR'); }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function gv(id) { var el = $(id); return el ? el.value : ''; }
function gn(id) { return parseFloat(gv(id)) || 0; }

/* ════════════════════════════
   비밀번호
════════════════════════════ */
function tryLogin() {
  if (gv('pwInput') === PW) {
    sessionStorage.setItem('rl_auth', 'ok');
    $('pwScreen').style.display = 'none';
    $('pwInput').value = '';
  } else {
    $('pwErr').style.display = 'block';
    $('pwInput').value = '';
    $('pwInput').focus();
    setTimeout(function() { $('pwErr').style.display = 'none'; }, 2500);
  }
}

/* ════════════════════════════
   가격표 연동 (GitHub)
════════════════════════════ */
function loadPricelist() {
  var cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('rl_gh_cfg2') || '{}'); } catch(e) {}
  var repo = cfg.repo || 'wesb2001/invoice';
  var file = cfg.file || 'pricelist.json';

  if (cfg.token) {
    // GitHub Contents API (캐시 없음)
    var apiUrl = 'https://api.github.com/repos/' + repo + '/contents/' + file;
    fetch(apiUrl, {
      headers: {
        'Authorization': 'Bearer ' + cfg.token,
        'Accept': 'application/vnd.github+json'
      }
    })
    .then(function(r) {
      if (r.status === 404) { renderPlBar('no-data'); return null; }
      if (!r.ok) { renderPlBar('error', 'HTTP ' + r.status); return null; }
      return r.json();
    })
    .then(function(meta) {
      if (!meta) return;
      var raw = atob(meta.content.replace(/\n/g, ''));
      var decoded = decodeURIComponent(Array.prototype.map.call(raw, function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      plData = JSON.parse(decoded);
      if (!Array.isArray(plData.customers) || !plData.customers.length) {
        renderPlBar('no-data');
      } else {
        renderPlBar('ready');
      }
    })
    .catch(function(e) { renderPlBar('error', e.message); });
  } else {
    // Raw URL fallback - 여러 CDN을 순차 시도
    var urls = [
      'https://cdn.jsdelivr.net/gh/' + repo + '@main/' + file + '?t=' + Date.now(),
      'https://raw.githubusercontent.com/' + repo + '/main/' + file + '?t=' + Date.now(),
      'https://api.github.com/repos/' + repo + '/contents/' + file
    ];
    var tryNext = function(i) {
      if (i >= urls.length) { renderPlBar('error', '모든 경로 실패'); return; }
      fetch(urls[i])
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          // GitHub Contents API는 base64 content를 반환
          if (data.content && data.encoding === 'base64') {
            var raw = atob(data.content.replace(/\n/g, ''));
            data = JSON.parse(decodeURIComponent(Array.prototype.map.call(raw, function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')));
          }
          plData = data;
          if (!Array.isArray(plData.customers) || !plData.customers.length) {
            renderPlBar('no-data');
          } else {
            renderPlBar('ready');
          }
        })
        .catch(function(e) {
          console.warn('Fetch failed for ' + urls[i] + ': ' + e.message);
          tryNext(i + 1);
        });
    };
    tryNext(0);
  }
}

var plSortMode = 'recent';

function getSortedCustomers() {
  if (!plData || !plData.customers) return [];
  var list = plData.customers.slice();
  if (plSortMode === 'asc') list.sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
  else if (plSortMode === 'desc') list.sort(function(a,b){return b.name.localeCompare(a.name,'ko');});
  else list.sort(function(a,b){return (b.lastUsed||0)-(a.lastUsed||0);});
  return list;
}

function setPlSort(mode) {
  plSortMode = mode;
  var labels = {recent:'최근 사용순', asc:'ㄱ→ㅎ', desc:'ㅎ→ㄱ'};
  ['recent','asc','desc'].forEach(function(m) {

function onCustSel() {
  var sel = $('plCustSel');
  if (!sel || !plData) return;
  var cid = sel.value;
  if (!cid) return;
  var c = plData.customers.filter(function(x) { return x.id === cid; })[0];
  if (!c) return;
  // 최근 사용 기록 (로컬 메모리 - 정렬용)
  c.lastUsed = Date.now();
  if (c.name)    $('rcvName').value = c.name;
  if (c.ceo)     $('rcvCeo').value = c.ceo;
  if (c.bizNo)   $('rcvBizNo').value = c.bizNo;
  if (c.address) $('rcvAddr').value = c.address;
  if (c.bizType) $('rcvType').value = c.bizType;
  if (c.bizItem) $('rcvItem').value = c.bizItem;
  if (c.contact) $('rcvContact').value = c.contact;
  upd();
}

function applyPl() {
  var sel = $('plCustSel');
  if (!sel || !plData) { alert('거래처를 선택하세요.'); return; }
  var cid = sel.value;
  if (!cid) { alert('거래처를 선택하세요.'); return; }
  var c = plData.customers.filter(function(x) { return x.id === cid; })[0];
  if (!c || !c.products.length) { alert('해당 거래처 품목이 없습니다.'); return; }
  rows = []; cnt = 0;
  c.products.forEach(function(p) {
    cnt++;
    rows.push({ id: cnt, name: p.name, unit: p.unit || 'ea', price: p.price || 0 });
  });
  renderRows();
  upd();
}

function clearItems() { rows = []; cnt = 0; addRow(); addRow(); addRow(); upd(); }

/* ════════════════════════════
   품목
════════════════════════════ */
function addRow() {
  cnt++;
  rows.push({ id: cnt, name: '', unit: 'ea', price: 0 });
  renderRows();
}

function delRow(id) {
  rows = rows.filter(function(r) { return r.id !== id; });
  if (!rows.length) addRow();
  else { renderRows(); upd(); }
}

function renderRows() {
  var b = $('itemsBody');
  b.innerHTML = '';
  rows.forEach(function(r, i) {
    var d = document.createElement('div');
    d.className = 'ir';
    d.innerHTML =
      '<span class="rn">' + (i+1) + '</span>' +
      '<input type="text" id="n' + r.id + '" placeholder="품명" value="' + esc(r.name || '') + '" oninput="upd()">' +
      '<input type="text" id="u' + r.id + '" placeholder="ea" value="' + esc(r.unit || 'ea') + '" oninput="upd()" style="text-align:center;">' +
      '<input type="number" id="q' + r.id + '" placeholder="0" min="0" oninput="upd()" style="text-align:right;">' +
      '<input type="number" id="p' + r.id + '" placeholder="0" min="0" value="' + (r.price || '') + '" oninput="upd()" style="text-align:right;">' +
      '<div class="au" id="s' + r.id + '">—</div>' +
      '<button class="btn-del" onclick="delRow(' + r.id + ')">✕</button>';
    b.appendChild(d);
  });
  upd();
}

function getItems() {
  var tt = gv('taxType');
  return rows.map(function(r, i) {
    var name = gv('n' + r.id), unit = gv('u' + r.id);
    var qty = gn('q' + r.id), price = gn('p' + r.id);
    var sup, tax, total;
    if (tt === 'inclusive') {
      // price = VAT포함단가, total = qty>0 ? qty*price : price
      total = qty > 0 ? qty * price : price;
      sup = Math.round(total / 1.1);
      tax = total - sup;
    } else {
      sup = qty * price;
      tax = tt === 'taxable' ? Math.round(sup * 0.1) : 0;
      total = sup + tax;
    }
    return { no: i+1, name: name, unit: unit, qty: qty, price: price, sup: sup, tax: tax, total: total };
  }).filter(function(i) { return i.name || i.total > 0; });
}

/* ════════════════════════════
   업데이트 (계산 + 미리보기)
════════════════════════════ */
function upd() {
  var items = getItems();
  var tt = gv('taxType');
  var isInclusive = tt === 'inclusive';
  var tSup = items.reduce(function(a, i) { return a + i.sup; }, 0);
  var tTax = items.reduce(function(a, i) { return a + i.tax; }, 0);
  var grand = tSup + tTax;

  $('tSup').textContent = '₩' + fmt(tSup);
  $('tTax').textContent = '₩' + fmt(tTax);
  $('tGrand').textContent = '₩' + fmt(grand);

  // 헤더 업데이트
  var hdrPrice = $('hdrPrice');
  var hdrAuto = $('hdrAuto');
  if (hdrPrice) hdrPrice.textContent = isInclusive ? 'VAT포함단가' : '단가';
  if (hdrAuto) hdrAuto.textContent = isInclusive ? '공급가액(역산)' : '공급가액';

  var taxLblMap = {taxable:'세액 (VAT 10%)', exempt:'세액 (면세)', zero:'세액 (영세율)', inclusive:'세액 (역산)'};
  $('taxLbl').textContent = taxLblMap[tt] || '세액';

  rows.forEach(function(r) {
    var qty = gn('q' + r.id);
    var price = gn('p' + r.id);
    var el = $('s' + r.id);
    if (!el) return;
    if (isInclusive) {
      var total = qty > 0 ? qty * price : price;
      var sup = Math.round(total / 1.1);
      el.textContent = sup > 0 ? fmt(sup) + '원' : '—';
    } else {
      var sup2 = qty * price;
      el.textContent = sup2 > 0 ? fmt(sup2) + '원' : '—';
    }
  });

  renderDoc(items, tSup, tTax, grand);
}

function renderDoc(items, tSup, tTax, grand) {

    ['No.', '품명', '규격/단위', '수량', '단가', '공급가액', '세액', '합계']
  ].filter(function(r) { return r !== null; });

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '거래명세서');
  XLSX.writeFile(wb, '거래명세서_' + rcv + '_' + date + '.xlsx');
}

  if(btn){btn.disabled=true;btn.textContent='저장 중...';}

  try{
    // 1) 기존 transactions.json 읽기
    var readResp=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:'rl2026',file:'transactions.json',action:'read'})
    });
    var readData=await readResp.json();
    if(!readResp.ok)throw new Error(readData.error||'읽기 실패');

    var txD=readData.data||{transactions:[]};
    if(!Array.isArray(txD.transactions))txD.transactions=[];
    txD.transactions.push(txData);
    txD.updatedAt=new Date().toISOString();

    // 2) Worker로 저장
    var saveResp=await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        password:'rl2026',
        file:'transactions.json',
        action:'save',
        data:txD,
        message:'거래 저장 ['+txData.date+' '+txData.customer+']'
      })
    });
    var saveData=await saveResp.json();
    if(!saveResp.ok)throw new Error(saveData.error||'저장 실패');

    if(btn){btn.textContent='✓ 저장됨';setTimeout(function(){btn.disabled=false;btn.textContent='💾 저장 후 발행';},2000);}
    doPrint();
  }catch(e){
    alert('거래 저장 실패: '+e.message+'\n인쇄는 계속 진행됩니다.');
    if(btn){btn.disabled=false;btn.textContent='💾 저장 후 발행';}
    doPrint();
  }
}

window.onload = init;
</script>
</body>
</html>
